<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
            th:replace="~{layout/base :: parent(
          title='Your cards',
          contentFragment=~{:: .page-content}
      )}">
<head>
    <title>Ignorato perché sostituito dal layout</title>
</head>
<body>
<!-- Questo tag corrisponde al selettore .page-content richiesto dal layout -->
<div class="page-content">
    <h1>Le tue carte</h1>
    <div><button th:href="@{/}"></button></div>
    <!-- Il contenitore padre -->
    <div class="cards-wrapper2">
        <!-- Il ciclo Thymeleaf che genera le 5 carte -->
        <div th:each="carta : ${carte}" class="card-container">
            <img th:src="${carta.imageUrl}" th:alt="${carta.name}"/>
        </div>
    </div>

</div>

</body>
</html>
