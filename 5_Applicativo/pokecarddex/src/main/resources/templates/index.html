<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: parent(
          title='Home Page',
          contentFragment=~{:: .page-content}
      )}">
<head>
    <title>Ignorato perché sostituito dal layout</title>
</head>
<body>
<!-- Questo tag corrisponde al selettore .page-content richiesto dal layout -->
<div class="page-content">
    <p>
        <img th:src="@{/images/mega_Darkrai-ex.png}" height="400px" style="position: absolute; left: 250px">
        <img th:src="@{/images/logo.png}" height="400px">
        <img th:src="@{/images/tyrantrum.png}" height="400px" style="position: absolute; right: 250px">
    </p>
    <h1>Benvenuto su POKÉCARDDEX!</h1>
    <h2>Uno dei pochi siti dedicati alla collezione delle celebri carte pokémon</h2>

    <h3>Le tue ultime carte aggiunte</h3>

    <!-- Il contenitore padre -->
    <div class="cards-wrapper">
        <!-- Il ciclo Thymeleaf che genera le 5 carte -->
        <div th:each="carta : ${carte}" class="card-container">
            <img th:src="${carta.imageUrl}" th:alt="${carta.name}"/>
        </div>
    </div>


</div>
</body>
</html>
