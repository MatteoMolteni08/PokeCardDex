<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: parent(
          title='Add cards',
          contentFragment=~{:: .page-content}
      )}">
<head>
  <title>Ignorato perché sostituito dal layout</title>
</head>
<body>
<!-- Questo tag corrisponde al selettore .page-content richiesto dal layout -->
<div class="page-content">
  <h1>Aggiungi carte</h1>
  <!-- Il contenitore padre -->
  <div class="filtri">
  <form id="form-filtri" onsubmit="inviaFiltri(event)">

    <input type="text" name="nome" id="filtro-nome" placeholder="Cerca Pokémon..."/>

    <select id="filtro-supertype" name="tipoCarta" onchange="aggiornaVisibilitaFiltri()">
      <option value="">Tutti i tipi</option>
      <option value="Pokemon">Pokémon</option>
      <option value="Trainer">Allenatore</option>
      <option value="Energy">Energia</option>
    </select>

    <select id="filtro-energia" name="tipoEnergia" style="display: none">
      <option value="">Tutti i tipi</option>
      <option value="Fire">Fuoco</option>
      <option value="Water">Acqua</option>
      <option value="Grass">Erba</option>
      <option value="Lightning">Lampo</option>
      <option value="Psychic">Psico</option>
      <option value="Fighting">Lotta</option>
      <option value="Darkness">Buio</option>
      <option value="Metal">Acciaio</option>
      <option value="Colorless">Normale</option>
      <option value="Dragon">Drago</option>
      <option value="Fairy">Folletto</option>
    </select>
    <select id="filtro-allenatore" name="tipoAllenatore" style="display: none">
      <option value="Supporter">aiuto</option>
      <option value="Item">strumento</option>
      <option value="Pokémon tool">oggetto pokémon</option>
      <option value="Stadium">stadio</option>
    </select>

    <select id="filtro-espansione" name="espansione">
      <option value="">Tutti i set</option>
      <option th:each="set : ${sets}" th:value="${set.getId()}" th:text="${set.getName()}"></option>
    </select>

    <button type="submit">Cerca Carte</button>
    <button type="button" onclick="resetFiltri()">Reset</button>
  </form>
</div>

  <div class="cards-wrapper2" id="griglia-carte">
    <th:block th:fragment="bloccoRisultati">
      <div th:each="carta : ${carte}" class="card-container">
        <img th:if="${carta.image != null || carta.image != ''}" th:src="${carta.image}+'/high.png'" th:alt="${carta.name}"/>
      </div>
      <div id="box-carica-altre" th:if="${paginaCarte.hasNext()}">
        <button type="button" th:onclick="'caricaAltre(' + (${paginaCarte.number} + 1) + ')'">
          Carica altre...
        </button>
      </div>
    </th:block>
  </div>

  <script th:src="@{/js/searchFilter.js}" defer></script>
</div>

</body>
</html>
